# Validate every LinkML schema, then check each one against the ontology it was converted from
# and that ontology's own examples.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole suite before it publishes anything.
  workflow_call:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  convert:
    name: converter reproduces ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: saref-core
            source: source/SAREFCore/saref.ttl
          - name: saref4bldg
            source: source/saref4bldg/saref4bldg.ttl
          - name: saref4ener
            source: source/saref4ener/saref4ener.ttl
          - name: saref4grid
            source: source/saref4grid/saref4grid.ttl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install rdflib pyyaml

      - name: Regenerate ${{ matrix.name }} from its source ontology
        run: python bin/owl2linkml.py ${{ matrix.source }} -o "$RUNNER_TEMP/${{ matrix.name }}.yaml"

      - name: Checked-in schema must match what the converter produces
        run: |
          diff -u <(grep -v '^name:' schema/${{ matrix.name }}.yaml) \
                  <(grep -v '^name:' "$RUNNER_TEMP/${{ matrix.name }}.yaml") && exit 0
          echo "::error file=schema/${{ matrix.name }}.yaml::stale - regenerate with bin/owl2linkml.py"
          exit 1

  validate:
    name: validate schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate models
        uses: NeverBlink-OSS/linkml-scala-action@v0.14.0
        with:
          working-directory: schema
          files: "*.yaml"
          strict: true
          ignore: "No 'tree_root' class"

  check:
    name: SHACL and RDFS checks (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: saref-core
            source: source/SAREFCore/saref.ttl
            examples: source/SAREFCore/examples
          - name: saref4bldg
            source: source/saref4bldg/saref4bldg.ttl
            examples: source/saref4bldg/examples
          - name: saref4ener
            source: source/saref4ener/saref4ener.ttl
            examples: source/saref4ener/examples
          - name: saref4grid
            source: source/saref4grid/saref4grid.ttl
            examples: source/saref4grid/examples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install rdflib pyyaml pyshacl

      - name: Generate SHACL
        uses: NeverBlink-OSS/linkml-scala-action@v0.14.0
        with:
          command: generate
          generator: shacl
          open: true
          imports: schema
          files: "schema/${{ matrix.name }}.yaml"
          output: build/shacl

      - name: Generate RDFS
        uses: NeverBlink-OSS/linkml-scala-action@v0.14.0
        with:
          command: generate
          generator: rdfs
          imports: schema
          files: "schema/${{ matrix.name }}.yaml"
          output: build/rdfs

      - name: Resolve generated artifacts
        id: resolve
        run: |
          set -euo pipefail
          ls -R build
          for kind in shacl rdfs; do
            count=$(find "build/$kind" -type f | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::build/$kind holds $count files, expected exactly one for ${{ matrix.name }}"
              exit 1
            fi
          done
          echo "SHACL=$(find build/shacl -type f)" >> "$GITHUB_ENV"
          echo "RDFS=$(find build/rdfs   -type f)" >> "$GITHUB_ENV"

      - name: RDFS - inheritance and property coverage
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          python checks/check-rdfs.py \
            --rdfs   "$RDFS" \
            --schema schema/${{ matrix.name }}.yaml \
            --source ${{ matrix.source }}

      - name: SHACL - examples must not be over-constrained
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          python checks/check-examples.py \
            --shapes   "$SHACL" \
            --schema   schema/${{ matrix.name }}.yaml \
            --examples ${{ matrix.examples }} \
            --build    build/${{ matrix.name }} \
            --mode     open

  examples:
    name: hand-written examples (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device-catalog
          - name: observation-log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema neverblink-linkml

      - name: Validate the example schema
        uses: NeverBlink-OSS/linkml-scala-action@v0.14.0
        with:
          files: "examples/${{ matrix.name }}.yaml"
          strict: true

      - name: JSON document must match the generated JSON Schema
        run: |
          python checks/check-json.py \
            --schema examples/${{ matrix.name }}.yaml \
            --data   examples/${{ matrix.name }}.json \
            --build  build/${{ matrix.name }}
