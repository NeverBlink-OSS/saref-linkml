enums:
  EventActionConsume:
    enum_uri: s4ener:EventActionConsume
    title: Event action consume
    description: An action type used to express a consume action to be performed as a consequence of an
      event used to send overload warning severity level and related load control commands to a device
      (e.g. a household appliance or a smart meter).
    mixins:
    - LoadControlEventAction
    permissible_values:
      EMERGENCY:
        meaning: s4ener:Emergency
        title: Emergency
        description: Load control event action with value 'emergency'
      INCREASE:
        meaning: s4ener:Increase
        title: Increase
        description: Load control event action with value 'increase'
      NORMAL:
        meaning: s4ener:Normal
        title: Normal
        description: The value NORMAL used to instantiate the Load Control Event Action class and MeasurandState
          class
      PAUSE:
        meaning: s4ener:Pause
        title: Pause
        description: Load control event action with value 'pause'
      REDUCE:
        meaning: s4ener:Reduce
        title: Reduce
        description: Load control event action with value 'reduce'
      RESUME:
        meaning: s4ener:Resume
        title: Resume
        description: Load control event action with value 'resume'
  EventActionProduce:
