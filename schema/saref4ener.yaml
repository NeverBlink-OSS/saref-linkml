id: https://saref.etsi.org/saref4ener/
name: saref4ener
title: SAREF for Energy Flexibility
description: "The flexibility ontology module (ic-flex) is by design tightly integrated with SAREF, \r\
  \nSAREF4ENER and the following InterConnect modules: power limit (ic-pwlm), \r\nincentive table (ic-inc),\
  \ S2 (ic-s2), data-point (ic-data) and forecast (ic-fc) \r\n\r\nThe main concept of the ic-flex module\
  \ is the s4ener:FlexOffer, which allows to \r\nrepresent a flexibility offer (or schedule) as a combination\
  \ of multiple time-series, data-points and forecasts. \r\n\r\nIt also allows to specify a creation time\
  \ (s4ener:hasCreationTime), validity \r\nperiod (s4ener:hasEffectivePeriod) and provenance (s4ener:producedBy)\
  \ for \r\nthe offer, on top of the creation time, validity period and provenance already specified for\
  \ the time-series and data-points included in the offer.\r\n\r\nThe additional key aspect captured in\
  \ the ic-flex module is that a flex offer can also include various categories of flexibility, which\
  \ are modelled as subclasses of the s4ener:FlexibilityProfile class, as follows:\r\n- Power Profile\
  \ flexibilty is modelled as s4ener:PowerProfile based on the EEBUS spec\r\n- Tariff based flexibility\
  \ (s4ener:TariffBased) is implemented using the incentive table (ic-inc) ontology based on the EEBUS\
  \ spec (note that tariif-based felxibility does note exist in S2)\r\n- Power limit flexibility (ic-pwlm:PowerLimit)\
  \ is implemented using  thepower limit (ic-pwlm) ontology based on the EEBUS spec (and compliant also\
  \ with S2)\r\n- Power Envelope flexibility (s4ener:PowerEnvelope) is implemented using theS2 (ic-s2)\
  \ that follows the S2 specification (and compliant also with EEBUS)\r\n- Demand driven flexibility (s4ener:DemandDriven)\
  \  flexibility (s4ener:PowerEnvelope) is implemented using theS2 (ic-s2) that follows the S2 specification\
  \ (and compliant also with EEBUS)\r\n- Operation mode flexibility (s4ener:OperationMode) is implemented\
  \ using theS2 (ic-s2) that follows the S2 specification (and compliant also with S2)\r\n- Fill rate\
  \ based flexibility (s4ener:FillRateBased is implemented using theS2 (ic-s2) that follows the S2 specification\
  \ (and compliant also with S2)"
