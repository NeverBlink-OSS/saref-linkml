comments:
- "Information about changes to version 2.1.1:\n\n- The classes and properties related to how to represent\
  \ devices in building spaces (such as the saref:BuildingSpace class,  saref:BuildingObject class and\
  \ saref:isLocatedIn property) have been removed from SAREF and incorporated  into the SAREF4BLDG extension\
  \ related to buildings, including the reuse of the W3C? WGS84 geo positioning vocabulary.\n- The saref:DeviceCategory\
  \ and saref:FunctionCategory classes have been removed. Instead, the hierarchy of device categories\
  \ has been implemented directly as subclasses of the saref:Device class.\n- The information specific\
  \ for energy efficiency has been moved to the SAREF4ENER extension. For example, the saref:Profile class\
  \ has been redefined to accommodate only the properties that are general enough for any type of profile,\
  \ not only for energy and power. Details on how to specifically model a power profile can be found in\
  \ the SAREF4ENER extension. \n- The subclasses of the saref:Energy class  have been removed (i.e., Average\
  \ Energy, Maximum Energy, Minimum Energy, Total Energy, HVAC Energy, Hot Water Energy and Lighting Energy).\n\
  - The saref:Property class has been split into two classes (saref:Property and saref:Measurement), as\
  \ it is done in the SAREF4ENVI extension, in order to properly accommodate the distinction between the\
  \ concept of property (an observable quality of something) and the concept of measurement (a concrete\
  \ value observed for a property).\n- Too restrictive cardinality restrictions have been revised, sometimes\
  \ making them optional rather than mandatory (better to make properties mandatory in the extensions\
  \ that specialize SAREF for a specific purpose, rather than restricting SAREF, whose purpose is more\
  \ general). For example, definitions of units of measurement using an enumeration (owl:oneOf) were too\
  \ restrictive because they did not allow using other units than those enumerated. Therefore, the individuals\
  \ of each class are still there, but the owl:oneOf enumeration has been removed.\n- The saref:UnitOfMeasure\
  \ subclasses use individuals from the OM ontology for unit of measures, but this is not the only solution.\
  \ It has been clarified in the comments that the OM ontology is an example, but other ontologies can\
  \ be used.\n- The global restrictions (rdfs:domain and rdfs:range) in object properties have been completely\
  \ removed not to hinder interoperability. Object properties are now only restricted locally in the classes.\
  \ \n- The subclasses of saref:Task have been transormed in individuals.\n- The saref:hasTask property\
  \ has been removed from the saref:Profile class to resolve an ambiguity with the saref:Task class."
- "Information about changes to version 3.1.1:\n\nNOTE:\tIn some cases, references have been added to\
  \ indicate the issue in the ETSI Forge (https://saref.etsi.org/sources/saref-core/issues) where the\
  \ change was discussed and implemented.\n\n- Added the saref:FeatureOfInterest class and the properties\
  \ used to relate it to saref:Measurement (saref:hasMeasurement and saref:isMeasurementOf) and to saref:Property\
  \ (saref:hasProperty and saref:isPropertyOf).\n- Added the saref:measurementMadeBy property as inverse\
  \ of saref:makesMeasurement.\n- The saref:relatesToProperty and saref:relatesToMeasurement properties\
  \ are now inverse of each other.\n- The range of saref:hasValue, which was defined as xsd:float, has\
  \ been removed to support other datatypes for measurements.\n- The range of datatype properties, which\
  \ was defined as xsd:string, has been removed in order to support strings with language tags (rdf:langString).\
  \ This affects saref:hasDescription, saref:hasManufacturer, saref:hasModel and saref:hasName, which\
  \ now have implicitly a range of rdfs:Literal.\n- The saref:hasName property has been removed and the\
  \ use of rdfs:label is recommended. \n- The saref:hasDescription property has been deprecated and the\
  \ use of rdfs:comment is recommended. \n- Too restrictive restrictions have been removed and in some\
  \ cases the ontology documentation has been updated to reflect this: a saref:Command having at most\
  \ one saref:hasDescription; a saref:Task being accomplished by at least one saref:Device; a saref:Device\
  \ having a typical consumption of only energy or power; a saref:Commodity being measured in units of\
  \ measure; restrictions on the values of saref:accomplishes that only covered specific use cases; universal\
  \ restrictions on the saref:actsUpon property have been changed to existential ones; restrictions on\
  \ the commands that a saref:Function may have, since there could be others not included in the defined\
  \ enumerations; restrictive documentation of saref:EventFunction and saref:SmokeSensor.\n- Bugs have\
  \ been fixed: some devices (saref:DoorSwitch, saref:EnergyMeter, saref:LigthSwitch, saref:SmokeSensor,\
  \ and saref:TemperatureSensor) were defined as subclass of a device and at the same time as consisting\
  \ of such device; a saref:LightSwitch controls light and does not measure light, since it is an actuator;\
  \ incorrect documentation of saref:OnState and saref:OffState.\n- The saref:BuildingRelated, saref:EnergyRelated\
  \ and saref:FunctionRelated classes have been removed, since the different extensions already classify\
  \ the device types.\n- The instances of the subclasses of saref:Command have been removed, since they\
  \ represent examples.\n- The instances of saref:UnitOfMeasure have been moved to examples.\n- The classes\
  \ related to the SAREF4ENER extension have been removed: saref:Generator, saref:Storage, saref:Load\
  \ and saref:EnergyMeter.\n- Some instances of saref:Device have been moved to examples: saref:WashingMachine,\
  \ saref:LightingDevice, saref:MicroRenewable, saref:Multimedia, and saref:Network.\n- Added domain and\
  \ range axioms wherever the definition of a property unambiguously identifies the domain or the range\
  \ of the property.\n- The OWL Time ontology is not imported anymore.\n- The documentation of some ontology\
  \ terms has been updated for clarification.\n- Language tags have been added to all labels and comments.\n"
- "Information about changes to version 3.2.1:\n\nNOTE: Rationale and decisions for many of the changes\
  \ in V3.2.1 are available in issues in project https://saref.etsi.org/sources/saref-core/issues.\n\n\
  - Definition of saref:FeatureOfInterest is clarified, not only properties are measured, but properties\
  \ and states can be observed and controlled.\n- Definition of saref:FeatureOfInterest: Clarify it is\
  \ a specific real world entity.\n- Definition of saref:FeatureOfInterest: allValuesFrom axioms are unnecessary\
  \ and have been deleted.\n- Introduced class saref:FeatureKind\n- Use SKOS to organize generic classes\
  \ in taxonomies.\n- Introduce hasClassKind for Class is Feature, Device, Property, State, Function,\
  \ Command.\n- Add local restrictions on consistsOf on feature of interest\n- Defined domain of saref:hasManufacturer\
  \ to union of feature kind and feature of interest.\n- Defined domain of saref:hasModel to union of\
  \ feature kind and feature of interest.\n- Most axioms on saref:Device were useless and have been deleted.\n\
  - definition of saref:Device clarifies it is a real world entity.\n- saref:Device is explicitly a subclass\
  \ of saref:FeatureOfInterest and s4syst:System.\n- saref:actsUpon now holds not only between a command\
  \ and a state. It generalizes actsUpon, observes, controls. Domain and range are unions of several classes.\n\
  - Introduced property saref:isActedUponBy.\n- Introduced property saref:observes, as sub-property of\
  \ saref:actsUpon. and generalization of measures.\n- Introduced property saref:controls, as sub-property\
  \ of saref:actsUpon. and generalization of saref:controlsProperty.\n- Introduced property saref:isControlledBy.\n\
  - saref:measuresProperty is deprecated: will be deleted in the next release of SAREF\n- saref:isMeasuredByDevice\
  \ is deprecated: will be deleted in the next release of SAREF\n- saref:isControlledByDevice is deprecated:\
  \ will be deleted in the next release of SAREF\n- saref:controlsProperty is deprecated: will be deleted\
  \ in the next release of SAREF\n- Definition of saref:Appliance is grounded on tasks and commodities.\n\
  - Definition of Sensor is simplified and grounded on saref:observes. Local restriction on saref:hasFunction\
  \ is deleted.\n- Definition of Actuator is simplified and grounded on saref:controls. Local restriction\
  \ on saref:hasFunction is deleted.\n- Definition of Meter is simplified and grounded on saref:observes.\
  \ Local restriction on saref:hasFunction is deleted.\n- Deprecated saref:HVAC for it is only an example.\n\
  - Deprecated saref:Switch for it is only an example.\n- Deprecated saref:DoorSwitch for it is only an\
  \ example.\n- Deprecated saref:LightSwitch for it is only an example.\n- Deprecated saref:SmokeSensor\
  \ for it is only an example.\n- Deprecated saref:TemperatureSensor for it is only an example.\n- The\
  \ following tasks are deprecated, and may be deleted in the next release of SAREF: saref:Cleaning, saref:Comfort,\
  \ saref:Drying, saref:EnergyEfficiency, saref:Entertainment, saref:Lighting, saref:MeterReading, saref:Safety,\
  \ saref:Washing, saref:WellBeing.\n- Definition of saref:Commodity is simplified.\n- saref:Electricity\
  \ is deprecated: will be defined as an instance of saref:Commodity in the next release of SAREF\n- saref:Gas\
  \ is deprecated: will be defined as an instance of saref:Commodity in the next release of SAREF\n- saref:Coal\
  \ is deprecated: will be defined as an instance of saref:Commodity in the next release of SAREF\n- saref:Water\
  \ is deprecated: will be defined as an instance of saref:Commodity in the next release of SAREF\n- New\
  \ category of commodities saref:EnergyCommodity\n- New category of commodities saref:NaturalResourceCommodity\n\
  - Introduced saref:consumes, saref:isConsumedBy, saref:produces, saref:isProducedBy, saref:stores, saref:isStoredBy.\n\
  - The definition and scope of usage for saref:Property is clarified. Axiomatization is simplified.\n\
  - applicability of saref:hasProperty is relaxed to also saref:FeatureKind\n- Introduced saref:PropertyOfInterest\
  \ to solved the ambiguity between generic vs specific properties.\n- Introduced saref:hasPropertyOfInterest\
  \ and saref:isPropertyOfInterestOf. Cannot use saref:hasProperty due to the combination of cardinality\
  \ restrictions and sub-property chain axioms makes the ontology exist the OWL 2 DL prodile.\n- Introduced\
  \ saref:PropertyValue to simplify the association of a measure to a property, without always needing\
  \ it to be a measurement made by a device.\n- Clarified definition of saref:hasValue.\n- Relaxed domain\
  \ of saref:isMeasuredIn so it can apply to saref:PropertyValue as well as saref:Measurement. The new\
  \ range will be enforced in the next release of SAREF.\n- Introduced saref:hasPropertyValue.\n- Introduced\
  \ saref:isValueOfProperty.\n- The following classes are deprecated and may be defined as instances of\
  \ saref:Property in the next release of SAREF: saref:Energy, saref:Humidity, saref:Light, saref:Motion,\
  \ saref:Occupancy, saref:Power, saref:Pressure, saref:Price, saref:Smoke, saref:Temperature\n- saref:EnergyUnit\
  \ is deprecated. Will be deleted in the next release of SAREF\n- saref:IlluminanceUnit is deprecated.\
  \ Will be deleted in the next release of SAREF\n- saref:PowerUnit is deprecated. Will be deleted in\
  \ the next release of SAREF\n- saref:PressureUnit is deprecated. Will be deleted in the next release\
  \ of SAREF\n- saref:TemperatureUnit is deprecated. Will be deleted in the next release of SAREF\n- Clarified\
  \ and generalized definition of saref:State. Can now apply to all features of interest, not just devices.\n\
  - Relaxed domain of saref:hasState.\n- Introduced saref:isStateOf.\n- Introduced saref:StateOfInterest,\
  \ parallel to saref:PropertyOfInterest.\n- Introduced saref:hasStateOfInterest and saref:isStateOfInterestOf,\
  \ parallel to saref:hasPropertyOfInterest and saref:isPropertyOfInterestOf.\n- The following classes\
  \ are deprecated and may be defined as instances of saref:State in the next release of SAREF: saref:CloseState,\
  \ saref:MultiLevelState, saref:OffState, saref:OnOffState, saref:OnState, saref:OpenCloseState, saref:OpenState,\
  \ saref:StartState, saref:StartStopState, saref:StopState.\n- Simplified definition and axiomatization\
  \ of saref:Function. Added examples.\n- saref:SensingFunction is deprecated: may be defined as an instance\
  \ of saref:Function in the next release of SAREF\n- saref:hasSensingRange is deprecated together with\
  \ saref:SensingFunction. And may be defined as an instance of saref:Property in the next release of\
  \ SAREF\n- saref:hasSensorType is deprecated together with saref:SensingFunction. Use saref:hasDeviceKind\
  \ instead.\n- saref:EventFunction is deprecated: may be defined as an instance of saref:Function in\
  \ the next release of SAREF\n- saref:hasThresholdMeasurement is deprecated together with saref:EventFunction.\
  \ And may be defined as an instance of saref:Property in the next release of SAREF\n- saref:MeteringFunction\
  \ is deprecated: may be defined as an instance of saref:Function in the next release of SAREF\n- deprecated\
  \ saref:hasMeterReading together with saref:Measurement and saref:MeteringFunction\n- deprecated saref:hasMeterReadingType\
  \ together with saref:MeteringFunction\n- saref:LevelControlFunction, saref:StartStopFunction, saref:OpenCloseFunction,\
  \ saref:OnOffFunction,  \n- saref:ActuatingFunction are deprecated: may be defined as an instance of\
  \ saref:Function in the next release of SAREF.\n- Domain of saref:hasFunction is relaxed.\n- Introduced\
  \ saref:isFunctionOf.\n- Introduced saref:FunctionOfInterest, parallel to saref:PropertyOfInterest.\n\
  - Simplified definition and axiomatization of saref:Command. Added examples.\n- Domain of saref:hasCommand\
  \ is relaxed to saref:Function or saref:FunctionOfInterest.\n- Introduced mandatory and optional commands.\n\
  - Introduced saref:hasInput and saref:hasOutput.\n- Introduced saref:CommandOfInterest, parallel to\
  \ saref:PropertyOfInterest.\n- The following classes are deprecated and may be defined as instances\
  \ of saref:Command in the next release of SAREF: saref:ToggleCommand, saref:GetCommand, saref:NotifyCommand,\
  \ saref:GetSensingDataCommand, saref:GetCurrentMeterValueCommand, saref:GetMeterDataCommand, saref:GetMeterHistoryCommand,\
  \ saref:SetAbsoluteLevelCommand, saref:SetRelativeLevelCommand, saref:SetLevelCommand, saref:StepDownCommand,\
  \ saref:StepUpCommand, saref:PauseCommand, saref:StartCommand, saref:StopCommand, saref:CloseCommand,\
  \ saref:OpenCommand, saref:OnCommand, saref:OffCommand.\n- Simplified definition of saref:Service. Added\
  \ examples.\n- Relaxed domain and range of saref:represents.\n- Clarified definition of saref:offers.\n\
  - Clarified definition of saref:isOfferedBy.\n- saref:SwitchOnService is deprecated for it is just an\
  \ example. It may be deleted in the next release of SAREF\n- Introduced saref:Operation and associated\
  \ properties from oneM2M base ontology.\n- Introduced saref:ProcedureExecution.\n- Introduce saref:madeBy\
  \ (resp. saref:madeExecution) as generalization of saref:measurementMadeBy (resp. saref:makesMeasurement).\n\
  - saref:makesMeasurement is deprecated as one of the properties related to saref:Measurement. It may\
  \ be deleted in the next release of SAREF\n- saref:makesMeasurement is deprecated as one of the properties\
  \ related to saref:Measurement. It may be deleted in the next release of SAREF\n- Introduced saref:hasResult\
  \ as part of general will to make SAREF and SOSA/SSN converge.\n- Introduced saref:hasResultTime as\
  \ part of general will to make SAREF and SOSA/SSN converge.\n- Introduced saref:hasPhenomenonTime as\
  \ part of general will to make SAREF and SOSA/SSN converge.\n- Tried to clarify definition of saref:hasTimestamp.\
  \ Still unclear.\n- Deprecated saref:Measurement in favour of saref:Observation, to generalize to observation\
  \ of states and convergence with SOSA/SSN.\n- Deprecated saref:isMeasurementOf together with saref:Measurement.\n\
  - Deprecated saref:isMeasurementOf together with saref:Measurement.\n- Deprecated saref:isMeasurementOf\
  \ together with saref:Measurement.\n- Deprecated saref:isMeasurementOf together with saref:Measurement.\n\
  - Class saref:Profile has been re-specified, to take into account findings from SAREF4ENER V1.2.1.\n\
  - Relaxed domain of saref:hasProfile to saref:FeatureKind or saref:Device\n- Deprecated saref:hasTime\
  \ and use OWL Time instead whenever possible.\n- Deprecated saref:Time and use OWL Time instead whenever\
  \ possible.\n- Deprecated saref:hasTypicalConsumption. May be defined as an instance of saref:Property\
  \ in the next release of SAREF.\n"
- 'Information about changes to version 4.1.1:


  NOTE: Rationale and decisions for many of the changes in V4.1.1 are available in issues in project https://labs.etsi.org/rep/saref/saref-core/-/milestones/3#tab-issues


  - Deprecated classes and properties have been deleted

  - Reworded definition of saref:Sensor and saref:Meter

  - saref:hasValue is now optional on saref:PropertyValue

  - improved parallel between Property and State descriptions

  - introduced saref:StateValue

  - Removed examples of commodity categories

  - Added notes and examples in multiple sections

  - Added clause 5.14 about composite properties

  - Reworked figures throughout the document

  - Added migration guide from V3.1.1 to V4.1.1

  - Updated the oneM2M base ontology to SAREF mapping

  - Added principle on generic versus specific entities distinction

  - Added references to EN 303 760

  '
see_also:
- https://www.etsi.org/deliver/etsi_ts/103200_103299/103264/04.01.01_60/ts_103264v040101p.pdf
prefixes:
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  owl: http://www.w3.org/2002/07/owl#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  s4syst: https://saref.etsi.org/saref4syst/
  saref: https://saref.etsi.org/core/
  skos: http://www.w3.org/2004/02/skos/core#
  time: http://www.w3.org/2006/time#
  vann: http://purl.org/vocab/vann/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: saref
default_range: string
imports:
- linkml:types
types:
  Duration:
    uri: xsd:duration
    typeof: string
  DateTimeStamp:
    uri: xsd:dateTimeStamp
    typeof: datetime
  GDay:
    uri: xsd:gDay
    typeof: string
  Int:
    uri: xsd:int
    typeof: integer
  Long:
    uri: xsd:long
    typeof: integer
  UnsignedInt:
    uri: xsd:unsignedInt
    typeof: integer
  UnsignedLong:
    uri: xsd:unsignedLong
    typeof: integer
  UnsignedShort:
    uri: xsd:unsignedShort
    typeof: integer
  NonNegativeInteger:
    uri: xsd:nonNegativeInteger
    typeof: integer
  PositiveInteger:
    uri: xsd:positiveInteger
    typeof: integer
slots:
  accomplishes:
    slot_uri: saref:accomplishes
    title: accomplishes
    description: Links a certain entity (e.g., a device) to the task it accomplishes.
    range: Task
    multivalued: true
    inverse: is_accomplished_by
  broader:
    slot_uri: skos:broader
    range: Any
    multivalued: true
    inverse: narrower
  consists_of:
    slot_uri: saref:consistsOf
    title: consists of
    description: A relationship indicating a composite entity that consists of other entities (e.g., a
      temperature/humidity sensor that consists of a temperature sensor and a humidity sensor)
    comments:
    - A feature kind (respectively a feature of interest) may consist of (OP saref:consistsOf) other feature
      kinds (respectively feature kinds or features of interest).
    - The OP saref:consistsOf can link a composite property, property of interest, or property value to
      its individual components.
    notes:
    - 'V3.2.1: Add local restrictions on consistsOf on feature of interest'
    range: Any
    multivalued: true
  consumes:
    slot_uri: saref:consumes
    title: consumes
    description: Links a feature kind, feature of interest, or device, to the commodity it consumes
    notes:
    - 'V3.2.1: Introduced saref:consumes, saref:isConsumedBy, saref:produces, saref:isProducedBy, saref:stores,
      saref:isStoredBy.'
    range: Commodity
    multivalued: true
    inverse: is_consumed_by
  controls:
    slot_uri: saref:controls
    title: controls
    description: Links a device, function, command, or procedure execution, to the feature, property,
      or state, it controls.
    notes:
    - 'V3.2.1: Introduced property saref:controls, as sub-property of saref:targets. and generalization
      of saref:controlsProperty.'
    mixins:
    - targets
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: Property
    - range: PropertyOfInterest
    - range: State
    - range: StateOfInterest
    multivalued: true
    inverse: is_controlled_by
  has_applicable_time:
    slot_uri: saref:hasApplicableTime
    title: has applicable time
    description: Links an entity (e.g., a profile) to an instant or interval or other compound temporal
      entity expressed using OWL Time, which bounds temporally the applicable context of that entity.
    any_of:
    - range: TemporalEntity
    - range: TemporalPosition
    multivalued: true
  has_command:
    slot_uri: saref:hasCommand
    title: has command
    description: Links a function or function of interest and the command it supports.
    notes:
    - 'V3.2.1: Domain of saref:hasCommand is relaxed to saref:Function or saref:FunctionOfInterest.'
    range: Command
    multivalued: true
    inverse: is_command_of
  has_command_kind:
    slot_uri: saref:hasCommandKind
    title: has command kind
    description: links a command of interest to its kind, a command.
    range: Command
    multivalued: true
  has_command_of_interest:
    slot_uri: saref:hasCommandOfInterest
    title: has command of interest
    description: Links a function of interest to one of its commands of interest.
    range: CommandOfInterest
    multivalued: true
    inverse: is_command_of_interest_of
  has_device_kind:
    slot_uri: saref:hasDeviceKind
    title: has device kind
    description: Links a device to its kind, a device kind. Kinds of devices describe models of devices,
      with common properties and common states having the same value, targeting the same properties and
      states, common functions, and common services.
    mixins:
    - has_feature_kind
    range: DeviceKind
    multivalued: true
  has_feature_kind:
    slot_uri: saref:hasFeatureKind
    title: has feature kind
    description: links a feature of interest to its kind, a feature kind
    notes:
    - 'V3.2.1: Introduce hasClassKind for Class is Feature, Device, Property, State, Function, Command.'
    range: FeatureKind
    multivalued: true
  has_function:
    slot_uri: saref:hasFunction
    title: has function
    description: Links a feature kind or a device to one of its functions.
    notes:
    - 'V3.2.1: Domain of saref:hasFunction is relaxed.'
    range: Function
    multivalued: true
    inverse: is_function_of
  has_function_kind:
    slot_uri: saref:hasFunctionKind
    title: has function kind
    description: links a function of interest to its kind, a function
    range: Function
    multivalued: true
  has_function_of_interest:
    slot_uri: saref:hasFunctionOfInterest
    title: has function of interest
    description: Links a device to one of its functions of interest.
    range: FunctionOfInterest
    multivalued: true
    inverse: is_function_of_interest_of
  has_identifier:
    slot_uri: saref:hasIdentifier
    title: has identifier
    description: Links some entity to its identifier. Extensions of SAREF may define sub-properties such
      as s4abcd:hasUUID, s4abcd:hasGTIN12, etc.
    see_also:
    - https://labs.etsi.org/rep/saref/saref-portal/-/issues/2
    range: Any
    multivalued: true
  has_input:
    slot_uri: saref:hasInput
    title: has input
    description: Links a command, operation, or procedure execution, to its inputs.
    notes:
    - 'V3.2.1: Introduced saref:hasInput and saref:hasOutput.'
    examples:
    - value: Different complementary commands can be defined for controlling a light. Turn on or off the
        light based on a desired state, toggle the light status of a specific light, set the luminosity
        level with a transition time, set the default transition time, start comfort.
    range: Any
    multivalued: true
  has_mandatory_command:
    slot_uri: saref:hasMandatoryCommand
    title: has mandatory command
    description: Links a function and one of its mandatory commands
    notes:
    - 'V3.2.1: Introduced mandatory and optional commands.'
    mixins:
    - has_command
    multivalued: true
  has_manufacturer:
    slot_uri: saref:hasManufacturer
    title: has manufacturer
    description: A relationship identifying the manufacturer of an entity (e.g., device). The value is
      expected to be a string or a string with language tag.
    notes:
    - 'V3.2.1: Defined domain of saref:hasManufacturer to union of feature kind and feature of interest.'
    range: Any
    multivalued: true
  has_model:
    slot_uri: saref:hasModel
    title: has model
    description: A relationship identifying the model of an entity (e.g., device). The value is expected
      to be a string or a string with language tag.
    notes:
    - 'V3.2.1: Defined domain of saref:hasModel to union of feature kind and feature of interest.'
    range: Any
    multivalued: true
  has_operation:
    slot_uri: saref:hasOperation
    title: has operation
    description: Links a service to one of its operations.
    range: Operation
    multivalued: true
    inverse: is_operation_of
  has_optional_command:
    slot_uri: saref:hasOptionalCommand
    title: has optional command
    description: Links a function and one of its optional commands
    mixins:
    - has_command
    multivalued: true
  has_output:
    slot_uri: saref:hasOutput
    title: has output
    description: Links a command or operation to its outputs.
    examples:
    - value: Different complementary commands can be defined for observing a smart home. Observe the temperature
        once will output the indoor temperature property; observe status of the entry door will output
        an open/close state.
    range: Any
    multivalued: true
  has_phenomenon_time:
    slot_uri: saref:hasPhenomenonTime
    title: has phenomenon time
    description: Links a procedure execution to the time that the result applies. It may be an interval
      or an instant, or some other compound temporal entity expressed using OWL Time.
    notes:
    - 'V3.2.1: Introduced saref:hasPhenomenonTime as part of general will to make SAREF and SOSA/SSN converge.'
    range: TemporalEntity
    multivalued: true
  has_profile:
    slot_uri: saref:hasProfile
    title: has profile
    description: Links a device to its profile. Its inverse is saref:isProfileOf. The device should be
      linked to a certain commodity using OP saref:consumes, saref:produces, or saref:stores, and optionally
      to some property or state using OP saref:targets or its sub-properties.
    notes:
    - 'V3.2.1: Relaxed domain of saref:hasProfile to saref:FeatureKind or saref:Device'
    range: Profile
    multivalued: true
    inverse: is_profile_of
  has_property:
    slot_uri: saref:hasProperty
    title: has property
    description: Links a feature kind or a feature of interest to one of its properties.
    notes:
    - 'V3.2.1: applicability of saref:hasProperty is relaxed to also saref:FeatureKind'
    range: Property
    multivalued: true
    inverse: is_property_of
  has_property_kind:
    slot_uri: saref:hasPropertyKind
    title: has property kind
    description: links a property of interest to its kind, a property.
    range: Property
    multivalued: true
  has_property_of_interest:
    slot_uri: saref:hasPropertyOfInterest
    title: has property of interest
    description: Links a feature of interest to one of its properties of interest.
    notes:
    - 'V3.2.1: Introduced saref:hasPropertyOfInterest and saref:isPropertyOfInterestOf. Cannot use saref:hasProperty
      due to the combination of cardinality restrictions and sub-property chain axioms makes the ontology
      exist the OWL 2 DL prodile.'
    range: PropertyOfInterest
    multivalued: true
    inverse: is_property_of_interest_of
  has_property_value:
    slot_uri: saref:hasPropertyValue
    title: has property value
    description: Links a feature kind, a feature of interest, or a property of interest, to a property
      value.
    notes:
    - 'V3.2.1: Introduced saref:hasPropertyValue.'
    range: PropertyValue
    multivalued: true
  has_result:
    slot_uri: saref:hasResult
    title: has result
    description: Links a procedure execution (e.g., an observation) to its result (e.g., a property value).
    notes:
    - 'V3.2.1: Introduced saref:hasResult as part of general will to make SAREF and SOSA/SSN converge.'
    range: Any
    multivalued: true
  has_result_time:
    slot_uri: saref:hasResultTime
    title: has result time
    description: Links a procedure execution to the instant of time when the activity was completed, expressed
      as an xsd:dateTime literal.
    notes:
    - 'V3.2.1: Introduced saref:hasResultTime as part of general will to make SAREF and SOSA/SSN converge.'
    range: datetime
    multivalued: true
  has_revision_number:
    slot_uri: saref:hasRevisionNumber
    title: has revision number
    description: Links some entity (e.g., a device) to its revision number.
    see_also:
    - https://labs.etsi.org/rep/saref/saref-core/-/issues/53
    range: string
    multivalued: true
  has_state:
    slot_uri: saref:hasState
    title: has state
    description: Links a feature kind or a feature of interest to one of its states.
    notes:
    - 'V3.2.1: Relaxed domain of saref:hasState.'
    range: State
    multivalued: true
    inverse: is_state_of
  has_state_kind:
    slot_uri: saref:hasStateKind
    title: has state kind
    description: links a state of interest to its kind, a state
    range: State
    multivalued: true
  has_state_of_interest:
    slot_uri: saref:hasStateOfInterest
    title: has state of interest
    description: Links a feature of interest to one of its states of interest.
    notes:
    - 'V3.2.1: Introduced saref:hasStateOfInterest and saref:isStateOfInterestOf, parallel to saref:hasPropertyOfInterest
      and saref:isPropertyOfInterestOf.'
    range: StateOfInterest
    multivalued: true
    inverse: is_state_of_interest_of
  has_state_value:
    slot_uri: saref:hasStateValue
    title: has state value
    description: Links a feature kind, a feature of interest, or a state of interest, to a state value.
    notes:
    - 'V4.1.1: Introduced saref:hasStateValue.'
    range: StateValue
    multivalued: true
  has_timestamp:
    slot_uri: saref:hasTimestamp
    title: has timestamp
    description: Links a procedure execution or a profile to an instant.
    comments:
    - Applied on a profile, it describes the applicable instant of that profile
    - When the execution time and the phenomenon time are the same time instants, then DP saref:hasTimestamp
      can be used to simply link a procedure execution to the time of these instants, expressed as an
      xsd:dateTime literal.
    notes:
    - 'V3.2.1: Tried to clarify definition of saref:hasTimestamp. Still unclear.'
    range: datetime
    multivalued: true
  has_value:
    slot_uri: saref:hasValue
    title: has value
    description: Value of a property value expressed as an RDF literal. Note that, even if decimal values
      are expected, values could use other datatypes.
    notes:
    - 'V3.2.1: Clarified definition of saref:hasValue.'
    range: Any
    multivalued: true
  has_version:
    slot_uri: saref:hasVersion
    title: has version
    description: Links some entity (e.g., a device) to its version.
    see_also:
    - https://labs.etsi.org/rep/saref/saref-core/-/issues/53
    range: string
    multivalued: true
  is_accomplished_by:
    slot_uri: saref:isAccomplishedBy
    title: is accomplished by
    description: A relationship identifying an entity (e.g., a device) that can accomplish a task.
    range: Any
    multivalued: true
    inverse: accomplishes
  is_command_of:
    slot_uri: saref:isCommandOf
    title: is command of
    description: Links a command and a function or function of interest that supports it.
    any_of:
    - range: Function
    - range: FunctionOfInterest
    multivalued: true
    inverse: has_command
  is_command_of_interest_of:
    slot_uri: saref:isCommandOfInterestOf
    title: is command of interest of
    description: Links a command of interest to the function of interest it is a command of.
    range: FunctionOfInterest
    multivalued: false
    inverse: has_command_of_interest
  is_consumed_by:
    slot_uri: saref:isConsumedBy
    title: is consumed by
    description: Links a commodity to the feature kind, feature of interest, or device, that consumes
      it
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: DeviceKind
    - range: Device
    multivalued: true
    inverse: consumes
  is_controlled_by:
    slot_uri: saref:isControlledBy
    title: is controlled by
    description: Links a feature, property, or state, to the device, function, command, or procedure execution,
      that controls it.
    notes:
    - 'V3.2.1: Introduced property saref:isControlledBy.'
    mixins:
    - is_target_of
    any_of:
    - range: DeviceKind
    - range: Device
    - range: Function
    - range: FunctionOfInterest
    - range: Command
    - range: CommandOfInterest
    - range: ProcedureExecution
    multivalued: true
    inverse: controls
  is_execution_of:
    slot_uri: saref:isExecutionOf
    title: is execution of
    description: Links a command execution to the command or command of interest that was executed. Also
      liks an operation execution to the operation that was executed
    any_of:
    - range: Command
    - range: CommandOfInterest
    - range: Operation
    multivalued: true
  is_function_of:
    slot_uri: saref:isFunctionOf
    title: is function of
    description: Links a function to the feature kind or device it is a function of.
    notes:
    - 'V3.2.1: Introduced saref:isFunctionOf.'
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    multivalued: true
    inverse: has_function
  is_function_of_interest_of:
    slot_uri: saref:isFunctionOfInterestOf
    title: is function of interest of
    description: Links a function of interest to the device it is a function of.
    range: Device
    multivalued: false
    inverse: has_function_of_interest
  is_measured_in:
    slot_uri: saref:isMeasuredIn
    title: is measured in
    description: A relationship identifying the unit of measure used for a certain entity.
    notes:
    - 'V3.2.1: Relaxed domain of saref:isMeasuredIn so it can apply to saref:PropertyValue as well as
      saref:Measurement. The new range will be enforced in the next major revision of SAREF.'
    range: UnitOfMeasure
    multivalued: true
  is_observed_by:
    slot_uri: saref:isObservedBy
    title: is observed by
    description: Links a feature, property, or state, to the device, function, command, or procedure execution,
      that observes it.
    mixins:
    - is_target_of
    any_of:
    - range: DeviceKind
    - range: Device
    - range: Function
    - range: FunctionOfInterest
    - range: Command
    - range: CommandOfInterest
    - range: ProcedureExecution
    multivalued: true
    inverse: observes
  is_offered_by:
    slot_uri: saref:isOfferedBy
    title: is offered by
    description: Links a service to the device that exposes it to a network
    notes:
    - 'V3.2.1: Clarified definition of saref:isOfferedBy.'
    range: Device
    multivalued: false
    inverse: offers
  is_operation_of:
    slot_uri: saref:isOperationOf
    title: is operation of
    description: Links an operation to the service it belongs to.
    range: Service
    multivalued: false
    inverse: has_operation
  is_produced_by:
    slot_uri: saref:isProducedBy
    title: is produced by
    description: Links a commodity to the feature kind, feature of interest, or device, that produces
      it
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: DeviceKind
    - range: Device
    multivalued: true
    inverse: produces
  is_profile_of:
    slot_uri: saref:isProfileOf
    title: is profile of
    description: Links a profile to the device it describes. The device should be linked to a certain
      commodity using OP saref:consumes, saref:produces, or saref:stores, and optionally to some property
      or state using OP saref:targets or its sub-properties.
    any_of:
    - range: DeviceKind
    - range: Device
    multivalued: true
    inverse: has_profile
  is_property_of:
    slot_uri: saref:isPropertyOf
    title: is property of
    description: Links a property to the feature kind or feature of interest it is a property of.
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    multivalued: true
    inverse: has_property
  is_property_of_interest_of:
    slot_uri: saref:isPropertyOfInterestOf
    title: is property of interest of
    description: Links a property of interest to the feature of interest it is a property of.
    range: FeatureOfInterest
    multivalued: false
    inverse: has_property_of_interest
  is_state_of:
    slot_uri: saref:isStateOf
    title: is state of
    description: Links a state to the feature kind or feature of interest it is a state of.
    notes:
    - 'V3.2.1: Introduced saref:isStateOf.'
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    multivalued: true
    inverse: has_state
  is_state_of_interest_of:
    slot_uri: saref:isStateOfInterestOf
    title: is state of interest of
    description: Links a state of interest to the feature of interest it is a state of.
    range: FeatureOfInterest
    multivalued: false
    inverse: has_state_of_interest
  is_stored_by:
    slot_uri: saref:isStoredBy
    title: is stored by
    description: Links a commodity to the feature kind, feature of interest, or device, that stores it
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: DeviceKind
    - range: Device
    multivalued: true
    inverse: stores
  is_target_of:
    slot_uri: saref:isTargetOf
    title: is target of
    description: Links a feature, property, or state, to the device, function, command, or procedure execution,
      that targets it.
    notes:
    - 'V3.2.1: Introduced property saref:isActedUponBy.'
    - 'V4.1.1: Renamed property saref:isActedUponBy into saref:isTargetOf.'
    any_of:
    - range: DeviceKind
    - range: Device
    - range: Function
    - range: FunctionOfInterest
    - range: Command
    - range: CommandOfInterest
    - range: ProcedureExecution
    multivalued: true
    inverse: targets
  is_value_of_property:
    slot_uri: saref:isValueOfProperty
    title: is value of property
    description: Links a property value to the property or property of interest it is a value of.
    notes:
    - 'V3.2.1: Introduced saref:isValueOfProperty.'
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: Property
    - range: PropertyOfInterest
    multivalued: true
  is_value_of_state:
    slot_uri: saref:isValueOfState
    title: is value of state
    description: Links a state value to the state or state of interest it is a value of.
    notes:
    - 'V4.1.1: Introduced saref:isValueOfState.'
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: StateOfInterest
    multivalued: true
  made_by:
    slot_uri: saref:madeBy
    title: made by
    description: Links a procedure execution to the entity (e.g., device) that made it.
    notes:
    - 'V3.2.1: Introduce saref:madeBy (resp. saref:madeExecution) as generalization of saref:measurementMadeBy
      (resp. saref:makesMeasurement).'
    range: FeatureOfInterest
    multivalued: true
    inverse: made_execution
  made_execution:
    slot_uri: saref:madeExecution
    title: made execution
    description: Links an entity (e.g., device) to the procedure execution it made.
    range: ProcedureExecution
    multivalued: true
    inverse: made_by
  narrower:
    slot_uri: skos:narrower
    range: Any
    multivalued: true
    inverse: broader
  observes:
    slot_uri: saref:observes
    title: observes
    description: Links a device, function, command, or procedure execution, to the feature, property,
      or state, it observes.
    notes:
    - 'V3.2.1: Introduced property saref:observes, as sub-property of saref:targets. and generalization
      of measures.'
    mixins:
    - targets
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: Property
    - range: PropertyOfInterest
    - range: State
    - range: StateOfInterest
    multivalued: true
    inverse: is_observed_by
  offers:
    slot_uri: saref:offers
    title: offers
    description: Links a device to a service it exposes to a network.
    notes:
    - 'V3.2.1: Clarified definition of saref:offers.'
    range: Service
    multivalued: true
    inverse: is_offered_by
  produces:
    slot_uri: saref:produces
    title: produces
    description: Links a feature kind, feature of interest, or device, to the commodity it produces
    range: Commodity
    multivalued: true
    inverse: is_produced_by
  profile_has_price:
    slot_uri: saref:profileHasPrice
    title: has price
    description: Links a profile to the money earned (negative values) or paid (positive values) for the
      use (production or consumption) of the commodity by the device
    range: PropertyValue
    multivalued: true
  represents:
    slot_uri: saref:represents
    title: represents
    description: Links a service to some function or function of interest it exposes to the network. Also
      links an operation to some command or command of interest it exposes to the network.
    notes:
    - 'V3.2.1: Relaxed domain and range of saref:represents.'
    any_of:
    - range: Function
    - range: FunctionOfInterest
    - range: Command
    - range: CommandOfInterest
    multivalued: true
  stores:
    slot_uri: saref:stores
    title: stores
    description: Links a feature kind, feature of interest, or device, to the commodity it stores
    range: Commodity
    multivalued: true
    inverse: is_stored_by
  targets:
    slot_uri: saref:targets
    title: targets
    description: Links a device, function, command, or procedure execution, to the feature, property,
      or state, it targets.
    notes:
    - 'V3.2.1: saref:actsUpon now holds not only between a command and a state. It generalizes observes,
      observes, controls. Domain and range are unions of several classes.'
    - 'V4.1.1: saref:actsUpon is renamed saref:targets.'
    any_of:
    - range: FeatureKind
    - range: FeatureOfInterest
    - range: Property
    - range: PropertyOfInterest
    - range: State
    - range: StateOfInterest
    multivalued: true
  when_property_value:
    slot_uri: saref:whenPropertyValue
    title: when property value
    description: Links a profile to a property value that contributes to restricting its applicable context.
    range: PropertyValue
    multivalued: true
  when_state:
    slot_uri: saref:whenState
    title: when state
    description: Links a profile to a state that contributes to restricting its applicable context.
    range: State
    multivalued: true
classes:
  Actuation:
    class_uri: saref:Actuation
    title: Actuation
    description: A saref:Actuation is the act of carrying out a procedure to control the state of the
      world using an actuator. It links to an actuator to describe what made the actuation, and to the
      controlled feature, property, property of interest, state, or state of interest. Typically, its
      input is a property value or a state. An actuation of a state (OP saref:controls) should have a
      state as input (OP saref:hasInput). Respectively, an actuation of a property should have a property
      value as input.
    mixins:
    - ProcedureExecution
    slots:
    - controls
    - made_by
    slot_usage:
      controls:
        required: true
      made_by:
        range: Actuator
  Actuator:
    class_uri: saref:Actuator
    title: Actuator
    description: A device designed to control one or more properties or states of one or more features
      of interest.
    notes:
    - 'V3.2.1: Definition of Actuator is simplified and grounded on saref:controls. Local restriction
      on saref:hasFunction is deleted.'
    mixins:
    - Device
    slots:
    - controls
    slot_usage:
      controls:
        required: true
  Any:
    class_uri: linkml:Any
    description: A value the ontology places no constraint on.
  Appliance:
    class_uri: saref:Appliance
    title: Appliance
    description: A device designed to accomplish a particular task for occupant use. It consumes, produces,
      or stores, some commodity.
    notes:
    - 'V3.2.1: Definition of saref:Appliance is grounded on tasks and commodities.'
    mixins:
    - Device
  Command:
    class_uri: saref:Command
    title: Command
    description: The lowest-level directives a function exposes to some network. Commands can target (OP
      saref:targets and its sub-properties) features, properties, or states. An instance of saref:Command
      is independent of any device.
    notes:
    - 'V3.2.1: Simplified definition and axiomatization of saref:Command. Added examples.'
    examples:
    - value: Observe property, control property, observe state, control state, invoke action, cancel action,
        turn on or off, change color, subscribe, publish, etc. are all commands.
    slots:
    - broader
    - controls
    - has_input
    - has_output
    - is_command_of
    - narrower
    - observes
    - targets
    slot_usage:
      broader:
        range: Command
      narrower:
        range: Command
  CommandExecution:
    class_uri: saref:CommandExecution
    title: Command Execution
    description: Describes the execution of a command. Typically, its inputs and outputs are human understandable
      and relate to some feature of interest, such as its state (e.g., s4abcd:On), or the value of its
      temperature (e.g., property value 21.0 °C).
    mixins:
    - ProcedureExecution
    slots:
    - is_execution_of
    slot_usage:
      is_execution_of:
        any_of:
        - range: Command
        - range: CommandOfInterest
  CommandOfInterest:
    class_uri: saref:CommandOfInterest
    title: Command Of Interest
    description: The lowest-level directives a device supports and exposes to some network. Commands can
      target (OP saref:targets and its sub-properties) features, properties, or states. A saref:CommandOfInterest
      is a directives actually supported by a device and exposed to some network.
    comments:
    - Commands of interest need not always be explicited. It depends on the use case. Typically, commands
      of interest are useful to specify the actual property of interest or state of interest that is expected
      as input parameter, output, or that will be targeted.
    - Like for commands, commands of interest may be described in terms of their input parameters, outputs,
      and which properties or states they target.
    notes:
    - 'V3.2.1: Introduced saref:CommandOfInterest, parallel to saref:PropertyOfInterest.'
    examples:
    - value: The corridor smart light switch supports a command of kind “turn on/off”, which controls
        the state of the outdoor light.
    - value: The smart fridge supports a command of kind “observe temperature”, which observes the temperature
        of the fridge.
    slots:
    - controls
    - has_command_kind
    - has_input
    - has_output
    - is_command_of_interest_of
    - observes
    - targets
    slot_usage:
      is_command_of_interest_of:
        required: true
        maximum_cardinality: 1
  Commodity:
    class_uri: saref:Commodity
    title: Commodity
    description: A marketable item which may be supplied without qualitative differentiation.
    comments:
    - Concepts from existing code lists, vocabularies, and taxonomies, may be used as instances of saref:Commodity,
      for example from the ISDA taxonomy of commodities, the Standard International Energy product Classification
      (SIEC), the IRENA Energy Taxonomy or Wikidata.
    - SAREF refers to energy commodities such as electricity, gas, coal and oil.
    notes:
    - 'V3.2.1: Definition of saref:Commodity is simplified.'
    - 'V4.1.1: Removed examples of commodity categories.'
    slots:
    - broader
    - is_consumed_by
    - is_produced_by
    - is_stored_by
    - narrower
    slot_usage:
      broader:
        range: Commodity
      narrower:
        range: Commodity
  Device:
    class_uri: saref:Device
    title: Device
    description: A tangible object designed to accomplish a particular task. In order to accomplish this
      task, the device performs one or more functions. An instance of saref:Device represents one specific
      real world entity.
    notes:
    - 'V3.2.1: Most axioms on saref:Device were useless and have been deleted.'
    - 'V3.2.1: definition of saref:Device clarifies it''s a real world entity.'
    - 'V3.2.1: saref:Device is explicitly a subclass of saref:FeatureOfInterest and s4syst:System.'
    examples:
    - value: Examples of devices are a light switch, a temperature sensor, an energy meter, a water flow
        meter, and a laundry dryer. A laundry dryer is designed to dry laundry, and to accomplish this
        task it has a start/stop function.
    - value: For example, a washing machine is designed to wash (task) and to accomplish this task it
        performs a start and stop function.
    mixins:
    - FeatureOfInterest
    - System
    slots:
    - consumes
    - has_device_kind
    - has_function_of_interest
    - has_profile
    - offers
    - produces
    - stores
    - targets
  DeviceKind:
    class_uri: saref:DeviceKind
    title: Device kinds
    description: Device kinds allow to describe kinds of devices, with common properties and common states
      having the same value, targeting the same properties and states, common functions, and common services.
      Devices kinds may be used to describe models of devices in online catalogues.
    notes:
    - 'V4.1.1: Introduced class saref:DeviceKind'
    - 'V4.1.1: Use SKOS to organize generic classes in taxonomies.'
    mixins:
    - FeatureKind
    slots:
    - broader
    - consumes
    - controls
    - has_profile
    - narrower
    - observes
    - produces
    - stores
    - targets
    slot_usage:
      broader:
        range: FeatureKind
      narrower:
        range: FeatureKind
  FeatureKind:
    class_uri: saref:FeatureKind
    title: Feature kinds
    description: Feature kinds allow to describe kinds of features of interest, with common properties
      having the same value, and common states being the same. An instance of saref:FeatureKind represents
      an archetype of real world entities, for example to populate product catalogs.
    notes:
    - 'V3.2.1: Introduced class saref:FeatureKind'
    - 'V3.2.1: Use SKOS to organize generic classes in taxonomies.'
    slots:
    - broader
    - consists_of
    - consumes
    - has_function
    - has_manufacturer
    - has_model
    - has_property
    - has_property_value
    - has_state
    - has_state_value
    - is_controlled_by
    - is_observed_by
    - is_target_of
    - narrower
    - produces
    - stores
    slot_usage:
      broader:
        range: FeatureKind
      consists_of:
        range: FeatureKind
      narrower:
        range: FeatureKind
  FeatureOfInterest:
    class_uri: saref:FeatureOfInterest
    title: Feature of interest
    description: A feature of interest represents any real world entity from which a property or a state
      may be targeted, such as observed and controlled. An instance of saref:FeatureOfInterest represents
      one specific real world entity.
    notes:
    - 'V3.2.1: Definition of saref:FeatureOfInterest is clarified, not only properties are measured, but
      properties and states can be observed and controlled.'
    - 'V3.2.1: Definition of saref:FeatureOfInterest: Clarify it''s a specific real world entity.'
    - 'V3.2.1: Definition of saref:FeatureOfInterest: allValuesFrom axioms are unnecessary and have been
      deleted.'
    slots:
    - consists_of
    - consumes
    - has_feature_kind
    - has_function
    - has_manufacturer
    - has_model
    - has_property
    - has_property_of_interest
    - has_property_value
    - has_state
    - has_state_of_interest
    - has_state_value
    - is_controlled_by
    - is_observed_by
    - is_target_of
    - made_execution
    - produces
    - stores
    slot_usage:
      consists_of:
        range: FeatureOfInterest
  Function:
    class_uri: saref:Function
    title: Function
    description: Logical groups of commands that devices support to accomplish their tasks. Function can
      target (OP saref:targets and its sub-properties) features, properties, or states. An instance of
      saref:Function can apply to different devices.
    notes:
    - 'V3.2.1: Simplified definition and axiomatization of saref:Function. Added examples.'
    examples:
    - value: To accomplish the task of controlling the light, a smart light switch may have a function
        for turning on and off the light, and another to set the luminosity of the light.
    - value: To accomplish the task of sensing the temperature, a temperature sensor should have a sensing
        function.
    - value: To accomplish the task of washing clothes, a washing machine should have a function for washing.
    slots:
    - broader
    - controls
    - has_command
    - has_mandatory_command
    - has_optional_command
    - is_function_of
    - narrower
    - observes
    - targets
    slot_usage:
      broader:
        range: Function
      narrower:
        range: Function
  FunctionOfInterest:
    class_uri: saref:FunctionOfInterest
    title: Function of Interest
    description: Logical groups of commands that devices support to accomplish their tasks. Function can
      target (OP saref:targets and its sub-properties) features, properties, or states. An instance of
      saref:FunctionOfInterest is supported by exactly one device.
    comments:
    - A function of interest is the function of (OP saref:isFunctionOfInterestOf) exactly one device.
    - Functions of interest need not always be explicited. It depends on the use case. Typically, functions
      of interest are useful to specify which command is actually exposed, and which actual property of
      interest or state of interest it targets.
    notes:
    - 'V3.2.1: Introduced saref:FunctionOfInterest, parallel to saref:PropertyOfInterest.'
    slots:
    - controls
    - has_command
    - has_command_of_interest
    - has_function_kind
    - is_function_of_interest_of
    - observes
    - targets
    slot_usage:
      is_function_of_interest_of:
        required: true
        maximum_cardinality: 1
  Meter:
    class_uri: saref:Meter
    title: Meter
    description: A device designed to observe and additionally do some computation and/or display one
      or more properties of one or more features of interest.
    notes:
    - 'V3.2.1: Definition of Meter is simplified and grounded on saref:observes. Local restriction on
      saref:hasFunction is deleted.'
    - 'V4.1.1: Definition of Sensor and Meter are updated to better distinguish one from the other.'
    mixins:
    - Device
    slots:
    - observes
    slot_usage:
      observes:
        required: true
  Observation:
    class_uri: saref:Observation
    title: Observation
    description: A saref:Observation is the act of carrying out a procedure to estimate or calculate a
      value of a property of a feature of interest, or a state of a feature of interest. It links to a
      sensor to describe what made the observation, and to the observed feature, property, property of
      interest, state, or state of interest. Typically, its result is a property value or a state. An
      observation of a state (OP saref:observes) should have a state as a result (OP saref:hasResult).
      Respectively, an observation of a property should have a property value as a result.
    mixins:
    - ProcedureExecution
    slots:
    - made_by
    - observes
    slot_usage:
      made_by:
        range: Sensor
      observes:
        required: true
  Operation:
    class_uri: saref:Operation
    title: Operation
    description: A saref:Operation is the means of a service to communicate in a procedure-type manner
      over the network (i.e. transmit data to/from other devices). It is the –machine interpretable– exposure
      of a –human understandable– command to a network.
    comments:
    - An operation may be described in terms of its inputs and outputs using OP saref:hasInput and saref:hasOutput.
      Inputs and outputs of operations typically describe the expected schema or shape of network messages.
    - Typically, a device connected to a given network offers one service for each of its functions of
      interest, and each service has one operation per command of interest of the function of interest
      it represents.
    notes:
    - 'V3.2.1: Introduced saref:Operation and associated properties from oneM2M base ontology.'
    examples:
    - value: In the set of operations exposed by a smart light bulb on a given network, one may be dedicated
        to turn on and off the light and expect a boolean as input. Another one may be dedicated to set
        the luminosity status and expect a target luminosity level (a byte) and a transition time (encoded
        on two bytes).
    - value: In the set of operations exposed by a smart washing machine on a given network, one may be
        dedicated to set the water temperature for the washing cycle, and expected as input a enumerated
        value. Another one may be dedicated to start, pause, or stop the washing cycle.
    - value: To turn on a light, send a CoAP PUT request with CBOR content 0xf5 (true)
    slots:
    - has_input
    - has_output
    - is_operation_of
    - represents
    slot_usage:
      is_operation_of:
        required: true
        maximum_cardinality: 1
      represents:
        any_of:
        - range: Command
        - range: CommandOfInterest
  OperationExecution:
    class_uri: saref:OperationExecution
    title: Operation Execution
    description: 'Describes the execution of an operation in a network: the–machine interpretable–  description
      of a communication between devices over the network. Typically, its input and result are network
      messages, that conform to the input and output of the executed operation.'
    mixins:
    - ProcedureExecution
    slots:
    - is_execution_of
    slot_usage:
      is_execution_of:
        range: Operation
  ProcedureExecution:
    class_uri: saref:ProcedureExecution
    title: Procedure Execution
    description: Represents the act of carrying out a procedure.
    notes:
    - 'V3.2.1: Introduced saref:ProcedureExecution.'
    slots:
    - has_input
    - has_result
    - has_result_time
    - has_timestamp
    - is_execution_of
    - made_by
    - targets
  Profile:
    class_uri: saref:Profile
    title: Profile
    description: A saref:Profile describes the money earned (negative values) or paied (positive values)
      for the use (production or consumption) of a commodity by a device in a certain context.
    comments:
    - OP saref:hasPrice links a profile to the money earned (negative values) or paid (positive values)
      for the use (production or consumption) of the commodity by the device.
    - OP saref:hasProfile links a device to its profile. The device should be linked to a certain commodity
      using OP saref:consumes, saref:produces, or saref:stores, and optionally to some property or state
      using OP saref:targets or its sub-properties.
    - The applicable context can be restricted to when a feature of interest has a certain state (OPs
      saref:whenState).
    - The applicable context can be restricted to when the property of a feature of interest has some
      value (OPs saref:whenPropertyValue)
    - The applicable context of a profile can be bound temporally using DP saref:hasTimestamp or its subproperties
      defined by SAREF extensions, or OP saref:hasApplicableTime which links to instant or interval or
      other compound temporal entity expressed using OWL Time.
    notes:
    - 'V3.2.1: Class saref:Profile has been re-specified, to take into account findings from SAREF4ENER
      V1.2.1.'
    slots:
    - has_timestamp
    - is_profile_of
    - profile_has_price
    - when_property_value
    - when_state
  Property:
    class_uri: saref:Property
    title: Property
    description: Identifiable qualities of features of interest that can be target of devices, such as
      observed or controlled. A property can apply to different features of interest.
    comments:
    - Concepts from existing code lists, vocabularies, and taxonomies, may be used as instances of saref:Property.
    notes:
    - Until SAREF V3.1.1, there was an ambiguity between whether properties should be specific or generic
      to features of interest. This ambiguity has been solved in SAREF V3.2.1, and the new modeling will
      be enforced in the next major revision of SAREF.
    - 'V3.2.1: The definition and scope of usage for saref:Property is clarified. Axiomatization is simplified.'
    examples:
    - value: Air temperature, pressure, luminance, etc. are all properties.
    - value: "Two examples using the QUDT Quantity Kind vocabulary, and the British Oceanographic Data\
        \ Centre Parameter Usage Vocabulary.\n\n<https://qudt.org/2.1/vocab/quantitykind/ActiveEnergy>\
        \ a saref:Property ;\n    rdfs:label \"Active Energy\"@en ;\n    rdfs:comment \"\"Active Energy\"\
        \ is the electrical energy transformable into some other form of energy.\"@en .\n\n<http://vocab.nerc.ac.uk/collection/P01/current/CDTSZZ01/>\
        \ a saref:Property ;\n    skos:prefLabel \"Absolute temperature standard deviation of the atmosphere\
        \ by dry bulb thermometer\"@en .\n"
    slots:
    - broader
    - consists_of
    - is_controlled_by
    - is_observed_by
    - is_property_of
    - is_target_of
    - narrower
    slot_usage:
      broader:
        range: Property
      consists_of:
        any_of:
        - range: FeatureKind
        - range: Property
        - range: State
      narrower:
        range: Property
  PropertyOfInterest:
    class_uri: saref:PropertyOfInterest
    title: Property of Interest
    description: Identifiable qualities of features of interest that can be target of devices, such as
      observed or controlled. An instance of saref:PropertyOfInterest is specific to a feature of interest.
      It is inherent to and cannot exist without that feature of interest.
    comments:
    - A property of interest is the property of (OP saref:isPropertyOfInterestOf) exactly one feature
      of interest.
    - 'Per convention, the IRI of properties of interest should consist of the IRI of their feature of
      interest, suffixed with a fragment identifier #{P} where {P} refers to the name of the property.'
    - Properties of interest need not always be explicited. It depends on the use case. Typically, properties
      of interest are useful in applications, where the association between a feature of interest and
      a property (i.e., the property of interest) needs to be identified and related to other properties
      of interest.
    notes:
    - 'V3.2.1: Introduced saref:PropertyOfInterest to solved the ambiguity between generic vs specific
      properties.'
    examples:
    - value: "The air temperature of the atmosphere sample at a certain location and altitude, the received\
        \ signal strength indicator of an wireless IoT connection, the luminance of the ETSI ATHENA amphitheatre.\n\
        \n<etsi_premises/athena#luminance> a saref:PropertyOfInterest ;\n    saref:isPropertyOfInterestOf\
        \ <etsi_premises/athena> ;\n    saref:hasPropertyKind saref:Luminance ;\n    rdfs:comment \"The\
        \ luminance of amphitheatre ATHENA\"@en .\n"
    slots:
    - consists_of
    - has_property_kind
    - has_property_value
    - is_controlled_by
    - is_observed_by
    - is_property_of_interest_of
    - is_target_of
    slot_usage:
      consists_of:
        any_of:
        - range: FeatureKind
        - range: Property
        - range: State
        - range: PropertyOfInterest
        - range: StateOfInterest
      is_property_of_interest_of:
        required: true
        maximum_cardinality: 1
  PropertyValue:
    class_uri: saref:PropertyValue
    title: Property Value
    description: Describes the value for a property. The property value is optionally linked to its value
      expressed as an RDF literal (DP saref:hasValue), optionally to the unit of measurement (OP saref:isMeasuredIn),
      and optionally to the properties or properties of interest it is a value of (OP saref:isValueOfProperty).
    notes:
    - 'V3.2.1: Introduced saref:PropertyValue to simplify the association of a measure to a property,
      without always needing it to be a measurement made by a device.'
    - 'V4.1.1: saref:hasValue is now optional on saref:PropertyValue.'
    slots:
    - consists_of
    - has_value
    - is_measured_in
    - is_value_of_property
    slot_usage:
      consists_of:
        any_of:
        - range: FeatureKind
        - range: Property
        - range: State
        - range: PropertyOfInterest
        - range: StateOfInterest
        - range: FeatureOfInterest
        - range: PropertyValue
        - range: StateValue
      has_value:
        maximum_cardinality: 1
      is_measured_in:
        maximum_cardinality: 1
  Sensor:
    class_uri: saref:Sensor
    title: Sensor
    description: A device designed to observe and measure one or more properties or states of one or more
      features of interest.
    notes:
    - 'V3.2.1: Definition of Sensor is simplified and grounded on saref:observes. Local restriction on
      saref:hasFunction is deleted.'
    - 'V4.1.1: Definition of Sensor and Meter are updated to better distinguish one from the other.'
    mixins:
    - Device
    slots:
    - observes
    slot_usage:
      observes:
        required: true
  Service:
    class_uri: saref:Service
    title: Service
    description: A saref:Service is a digital representation of a function in a network, making it discoverable,
      registerable and remotely controllable in the network.
    comments:
    - Typically, a device connected to a given network offers one service for each of its functions of
      interest.
    notes:
    - 'V3.2.1: Simplified definition of saref:Service. Added examples.'
    examples:
    - value: For example, a light switch can offer the service of remotely switching the lights in a home
        through mobile phone devices that are connected to the local network (ex:SwitchOnService class).
        This "remote switching" service represents the ex:OnOffFunction.
    slots:
    - has_operation
    - is_offered_by
    - represents
    slot_usage:
      is_offered_by:
        required: true
        maximum_cardinality: 1
      represents:
        any_of:
        - range: Function
        - range: FunctionOfInterest
  State:
    class_uri: saref:State
    title: State
    description: Identifiable conditions that features of interest are or may be in, and that can be target
      of devices, such as observed and controlled. A state can apply to different features of interest.
    comments:
    - Concepts from existing code lists, vocabularies, and taxonomies, may be used as instances of saref:State.
    - SAREF is not restricted to binary states such as the ex:OnOffState, but allows to define also enumerated
      states.
    notes:
    - 'V3.2.1: Clarified and generalized definition of saref:State. Can now apply to all features of interest,
      not just devices.'
    examples:
    - value: A switch can be found in the saref:OnOffState.
    slots:
    - broader
    - is_controlled_by
    - is_observed_by
    - is_state_of
    - is_target_of
    - narrower
    slot_usage:
      broader:
        range: State
      narrower:
        range: State
  StateOfInterest:
    class_uri: saref:StateOfInterest
    title: State of Interest
    description: Identifiable conditions that features of interest are or may be in, and that can be target
      of devices, such as observed and controlled. An instance of saref:StateOfInterest is specific to
      a feature of interest. It is inherent to and cannot exist without that feature of interest.
    comments:
    - A state of interest is the state of (OP saref:isStateOfInterestOf) exactly one feature of interest.
    - 'Per convention, the IRI of states of interest should consist of the IRI of their feature of interest,
      suffixed with a fragment identifier #{S} where {S} refers to the name of the state.'
    - States of interest need not always be explicited. It depends on the use case. Typically, states
      of interest are useful in applications, where the association between a feature of interest and
      a state (i.e., the state of interest) needs to be identified and related to other states of interest.
    notes:
    - 'V3.2.1: Introduced saref:StateOfInterest, parallel to saref:PropertyOfInterest.'
    slots:
    - has_state
    - has_state_kind
    - has_state_value
    - is_controlled_by
    - is_observed_by
    - is_state_of_interest_of
    - is_target_of
    slot_usage:
      is_state_of_interest_of:
        required: true
        maximum_cardinality: 1
  StateValue:
    class_uri: saref:StateValue
    title: State Value
    description: Describes the value for a state. The state value is optionally linked the states or states
      of interest it is a value of (OP saref:isValueOfState).
    notes:
    - 'V4.1.1: Introduced saref:StateValue.'
    slots:
    - is_value_of_state
  System:
    class_uri: s4syst:System
  Task:
    class_uri: saref:Task
    title: Task
    description: The goal for which a device is designed, from a user perspective.
    comments:
    - Tasks can be accomplished by devices (saref:isAccomplishedBy).
    examples:
    - value: For example, a washing machine is designed for the task of washing.
    slots:
    - broader
    - is_accomplished_by
    - narrower
    slot_usage:
      broader:
        range: Task
      narrower:
        range: Task
  TemporalEntity:
    class_uri: time:TemporalEntity
  TemporalPosition:
    class_uri: time:TemporalPosition
  UnitOfMeasure:
    class_uri: saref:UnitOfMeasure
    title: Unit of measure
    description: The unit of measure is a standard for measurement of a quantity, such as a Property.
    comments:
    - Concepts from existing code lists, vocabularies, and taxonomies, may be used as instances of saref:UnitOfMeasure.
      For example the QUDT Unit vocabulary
    - Our definition is based on the definition of unit of measure in the Ontology of units of Measure
      (OM).
    examples:
    - value: 'For example, consumption power is a property and Watt is a unit of power that represents
        a definite predetermined power: when we say 10 Watt, we actually mean 10 times the definite predetermined
        power "Watt".'
