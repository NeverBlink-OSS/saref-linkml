id: https://saref.etsi.org/core/
name: saref-core
title: 'SAREF: the Smart Applications REFerence ontology'
description: The Smart Applications REFerence ontology (SAREF) is intended to enable interoperability
  between solutions from different providers and among various activity sectors in the Internet of Things
  (IoT), thus contributing to the development of the global digital market.
license: https://forge.etsi.org/etsi-software-license
version: https://saref.etsi.org/core/v4.1.1/
created_on: '2024-10-31'
last_updated_on: '2024-03-06'
source: https://saref.etsi.org/sources/saref-core/
